name: Marketplace policy

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  # The clio-agent the plugin check and plugin tests run against. This branch
  # needs clio-agent's fork, science log and derived roles (iowarp/clio-agent#1869);
  # set it back to develop once that merges.
  CLIO_AGENT_REF: claude/delegation-fork-science

jobs:
  policy:
    # Dependency-free: the plugin layout test, the model-pin policy and the
    # dataset-literal (L3 leakage) lint run on a bare interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test the layout and policy checkers
        run: uv run --no-project --python 3.13 python -m unittest discover -s tests -v
      - name: Reject undocumented model pins
        run: uv run --no-project --python 3.13 python scripts/check_model_pins.py .
      - name: Reject dataset-specific literals in plugin prompts
        run: uv run --no-project --python 3.13 python scripts/check_skill_literals.py .

  plugin-check:
    # The install resolver, run against this checkout: loads every plugin
    # exactly as install does and resolves every agent class (packs,
    # requirements, tool and skill collisions, prompt files, fragment budgets).
    # `--prerelease=allow`: clio-agent depends on pre-release dspy/fastmcp.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: clio-agent plugin check
        env:
          CLIO_PLUGIN_STORE: ${{ runner.temp }}/clio-plugin-store
        run: |
          uv run --python 3.14 --prerelease=allow \
            --with "clio-agent @ git+https://github.com/iowarp/clio-agent@${{ env.CLIO_AGENT_REF }}" \
            clio-agent plugin check .
      - name: clio-agent plugin check (smoke-test marketplace)
        env:
          CLIO_PLUGIN_STORE: ${{ runner.temp }}/clio-plugin-store
        run: |
          uv run --python 3.14 --prerelease=allow \
            --with "clio-agent @ git+https://github.com/iowarp/clio-agent@${{ env.CLIO_AGENT_REF }}" \
            clio-agent plugin check testing

  plugin-tests:
    # Each plugin's own tests (plugins/*/tests): A2UI catalog composability,
    # subagent contracts, bundled skill scripts and eval tooling. They need
    # clio-agent (which brings clio-schemas) plus the scientific packages the
    # skill scripts use (h5py, adios2 and netCDF4 for the format conversion
    # and Morphorm checks, which otherwise skip).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the plugin tests
        run: |
          uv run --python 3.14 --prerelease=allow \
            --with "clio-agent @ git+https://github.com/iowarp/clio-agent@${{ env.CLIO_AGENT_REF }}" \
            --with "numpy>=1.24" --with "jsonschema>=4.18" --with pyarrow --with trimesh \
            --with h5py --with adios2 --with netCDF4 \
            --with pytest \
            pytest plugins/*/tests -v

  spotter-impl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project plugins/spotter/impl --python 3.13 --frozen --extra dev
      - run: uv run --no-sync ruff check src tests
        working-directory: plugins/spotter/impl
      - run: uv run --no-sync pyright
        working-directory: plugins/spotter/impl
      - run: uv run --no-sync pytest tests -q
        working-directory: plugins/spotter/impl
