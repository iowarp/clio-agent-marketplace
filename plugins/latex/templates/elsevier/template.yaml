name: elsevier
title: Elsevier article (elsarticle)
# What the paper's card shows: its type, and the venue it is written for.
document_type: Paper
venue: Elsevier journal
class: elsarticle
options: []
entry: main.tex
files: [main.tex, sections/body.tex, refs.bib]
# The rules below are this kind of venue's usual defaults. Set them from the
# call for papers of the venue the paper goes to.
rules:
  page_limit: null
  references_count: true
  double_blind: false
  required_packages: []
  forbidden_packages: []
  paper_size: a4
