[project]
name = "hdf5-ptc"
version = "0.1.0"
description = "The hdf5-ptc plugin's MCP server: HDF5 and NetCDF-4 files by handle, cost before reading, whole arrays for scripts"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
    "fastmcp>=4.1",
    "h5py>=3.12",
    "numpy>=1.26",
    "fsspec>=2025.9",
    "aiohttp>=3.9",
    "h5netcdf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
hdf5-ptc-mcp = "hdf5_ptc.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdf5_ptc"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
