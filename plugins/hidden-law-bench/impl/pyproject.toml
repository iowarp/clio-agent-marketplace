[project]
name = "hidden-law-bench"
version = "0.1.0"
description = "The hidden-law-bench plugin's MCP server: a simulated apparatus with a secret-seeded law"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = ["fastmcp>=4.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
hidden-law-bench-mcp = "hidden_law_bench.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hidden_law_bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
