schema: clio.package-contract.v1
package: lammps
title: LAMMPS
version: 0.1.1
kind: application
summary: >-
  LAMMPS 29Aug2024 (update 1), Sandia's classical molecular dynamics code
  (atomic liquids and solids, polymers, granular and coarse-grained models,
  materials under shear or shock), with MPI. script names a LAMMPS input
  script in the solver's own command language
  (https://docs.lammps.org/stable/Commands.html) that holds the whole case:
  units, atom_style, the box and atoms (lattice, region, create_box and
  create_atoms, or read_data), mass, pair_style and pair_coeff, velocity,
  fixes, thermo and its run commands. Author it for the person's case;
  nothing here fixes a scenario. data_files lists the other files it reads
  (read_data files, potential files), copied into run_dir beside it. The
  package copies the script into run_dir as in.lammps and runs it as
  written, adding one dump of its own, clio, just before the first run:
  every dump_interval steps a frame of atom ids, types, positions and
  velocities. Each frame appears in run_dir/frames as a VTK PolyData file
  (atoms as points with id, type, velocity and speed) only once LAMMPS has
  written all its atoms, so ParaView's XML PolyData reader follows the
  series live; progress counts them. steps is the total of the script's
  run commands (checked when they are plain numbers), and the script must
  not name a dump clio or keep its runs in an included file. The software
  is any Spack lammps 20240829.1 with MPI and its default packages (KSPACE,
  MANYBODY, MOLECULE, RIGID); a site that already has one is reused as it
  is. Styles from other LAMMPS packages need a site build that has them.
  MPI, the launcher, the nodes and the ranks per node come from the site
  through JARVIS, never from the script.
install:
  method: spack
  # MPI stays the mpi virtual, so the site's MPI is reused; Spack's builtin
  # lammps recipe builds lmp with the default packages.
  query: lammps@20240829.1 +mpi
  repos: []

parameters:
  required: [nprocs, script, steps, dump_interval]
  properties:
    nprocs: {minimum: 1, maximum: 65536}
    ppn: {minimum: 1, maximum: 256}
    cores_per_node: {minimum: 1, maximum: 1024}
    script: {minLength: 1}
    steps: {minimum: 1}
    dump_interval: {minimum: 1}
    walltime: {minimum: 1}
  review: [script, data_files, nprocs, ppn, steps, dump_interval, walltime, queue]
  fill:
    run_dir: "{shared_dir}/run"

resources:
  process_count: {param: nprocs}
  processes_per_node: {param: ppn}
  duration: {param: walltime}
  queue_name: {param: queue}

sizing:
  mesh: >-
    No mesh: the cost is the atoms and their neighbours. The script sets the
    atom count (create_atoms on a lattice: 4 atoms per fcc cell, 2 per bcc,
    1 per sc, times the cells of the region; or the read_data file's atom
    count) and the box. The pair cutoff plus the neighbor skin sets the
    neighbours per atom, about (4/3) pi (cutoff + skin)^3 x number density;
    in LJ units at density 0.84 and cutoff 2.5 that is about 55.
  decomposition: block3d
  ranks: >-
    LAMMPS gives each rank one brick of the box (processors * * * picks the
    grid), so keep a few thousand atoms or more per rank: under about 1000
    the ghost-atom communication dominates. A dense uniform liquid or solid
    balances well; a system with vacuum or clusters needs the balance
    command or fewer ranks.
  processes_per_node: {param: ppn, default: physical_cores, cores: cores_per_node}
  nodes: {ceil_div: [nprocs, ppn]}
  cost: >-
    walltime seconds = steps x seconds per step plus one dump per
    dump_interval and the startup. A run's clio-run-result.json reports
    LAMMPS's own Performance lines (timesteps per second) and the loop time
    of its last run. A Lennard-Jones liquid runs roughly 1 to 2 microseconds
    per atom-step per core, an EAM metal 3 to 5, and long-range Coulomb
    (kspace pppm) 10 or more. Each text frame holds about 80 bytes per atom
    and its .vtp about 40.

outputs:
  - name: frames
    description: >-
      One frame per dump_interval steps from the first run's start, named
      frames/frame_<timestep, ten digits>.vtp: VTK XML PolyData with one
      point per atom (positions in the script's units) and point arrays id,
      type, velocity and speed, the simulated time as TimeValue and the box
      as field data. ParaView's XMLPolyDataReader reads the series.
    path: "{run_dir}/frames/frame_*.vtp"
    path_kind: glob
    format: vtk-polydata
    reader: XMLPolyDataReader
    expected_steps: {add: [{div: [steps, dump_interval]}, 1]}
    follow: {signal: file-count, poll_seconds: 5}
    time: {unit: simulated time in the script's units}
    display:
      array: type
      association: POINTS
      representation: Surface
      color_map: Jet
    arrays: [id, type, velocity, speed]
  - name: run-result
    role: result
    description: >-
      clio-run-result.json, the run's verdict (schema clio.lammps-run.v1):
      status, cause, frames written of expected, the first and last frame
      timesteps, the atoms, LAMMPS's loop time and Performance lines, wall
      seconds and the ranks. Every run writes it.
    path: "{run_dir}/clio-run-result.json"
    path_kind: file
    format: json
  - name: log
    role: statistics
    description: >-
      log.lammps, LAMMPS's own log: the thermo output of every run, the
      neighbour statistics and the timing breakdown.
    path: "{run_dir}/log.lammps"
    path_kind: file
    format: text

progress:
  unit: step
  # The package prints "clio-lammps frame I of M" once frame I is whole in frames/.
  step_pattern: '^clio-lammps frame (?P<step>\d+) of \d+'
  announces: after-write
  output: frames
  total: {div: [steps, dump_interval]}
  done_pattern: '^clio-lammps result \{"status": "ok"'

provenance:
  inputs:
    - "{run_dir}/in.lammps"
    - "{run_dir}/clio-case.json"
  upstream:
    - name: LAMMPS 29Aug2024 update 1 (MPI), as Spack's builtin lammps recipe builds it
      version: "20240829.1"
      url: https://github.com/lammps/lammps/tree/stable_29Aug2024_update1

selftest:
  # 16384 Lennard-Jones atoms on an fcc lattice melt from a hot start.
  params:
    nprocs: 8
    ppn: 8
    script: "{pkg_dir}/config/lj_melt.lammps"
    steps: 2000
    dump_interval: 100
    walltime: 900
  max_seconds: 900
  script: selftest.py
