schema: clio.package-contract.v1
package: xcompact3d
version: 0.3.7
kind: application
summary: >-
  Xcompact3d (Incompact3d v5.0) incompressible flow simulation. Give it an STL
  file in geometry and it simulates uniform flow along +x past that body (a
  wing section, a car body, a cylinder, any closed solid) with the immersed
  boundary method; leave geometry empty for the Taylor-Green vortex at Re 1600.
  Setting up a body case, in order.
  Units: everything is in body lengths. The body is scaled to L = 1 (its x
  extent, or reference_length in STL units), so the viscosity is nu = inflow /
  re and a time unit is the time the flow takes to cross L at inflow 1. angle
  turns the body nose up about z; if the CAD part is already pitched, set angle
  0 and reference_length to its chord in STL units, since the x extent of a
  pitched body is longer than its chord.
  Grid: the body sits upstream body lengths from the inlet, with downstream
  body lengths of wake behind it and lateral body lengths each side. The
  spacing is h = 1 / resolution in x and y, so the grid is about (upstream +
  body length + downstream) x resolution by (body height + 2 x lateral) x
  resolution points, rounded up to FFT-friendly counts. span periodic runs a
  section extruded along z as a thin periodic slab with nz = max(8, span length
  x resolution / 2) points rounded up, so dz is about 2h, except that a span shorter than 16 /
  resolution gets dz = span length / 8, which is finer and tightens the time
  step; span free runs a whole 3D body with dz = h and costs far more. Aim for
  6 or more points across the body's thickness (thickness x resolution): a 12
  percent section at resolution 24 has about 3, enough for the wake but not
  for forces worth quoting. The boundary layer is about L / sqrt(re) thick, so
  a coarse grid shows the wake qualitatively, not the layer.
  Reynolds number: re = U L / nu. Bluff bodies start to shed near re 50; 100 to
  3000 gives laminar to unsteady wakes at these resolutions, and higher re
  needs a finer grid than these cases afford.
  Time step: work dt out before submitting, because configure checks it only
  when the job starts, after any approval, and refuses an unstable one. Two
  limits hold together. Convection: CFL = inflow x dt / h at most 0.2, aim for
  0.1, which is dt about 0.1 / (resolution x inflow). Viscous: dt x nu x (2 /
  h^2 + 1 / dz^2) at most 0.0075 for this scheme, which with dz = 2h is dt at
  most 0.0033 x re / (resolution^2 x inflow), and with dz = h (span free) is dt
  at most 0.0025 x re / (resolution^2 x inflow). Take the smaller and round it
  down. At resolution 24, re 1000 and inflow 1 with dz = 2h that is the smaller
  of 0.0042 and 0.0058, so dt 0.004; a 0.25 chord span at the same settings has
  dz = 0.031 and needs dt 0.003. Low re is limited by viscosity, high re by
  convection. clio-case.json records the cfl, diffusion_number and
  suggested_dt of the run, and a refusal names the largest safe dt.
  Run length and snapshots: the simulated time is ilast x dt. The wake needs
  ilast x dt x inflow to cover two to three domain lengths before shedding
  shows, and a bluff body sheds about every 5 / inflow time units (Strouhal
  number near 0.2), so a few shedding cycles take 30 to 50 time units. There
  are ilast / ioutput snapshots; 50 to 200 make a smooth live view, and each
  holds 7 fields of nx x ny x nz doubles.
  Cost: a run is about nx x ny x nz x ilast point-steps, so walltime in seconds
  is about nx x ny x nz x ilast / (throughput x nprocs), with the site's
  point-steps per second per MPI rank measured from a short run of the same
  build (see sizing); add the startup overhead a pilot measured (see below)
  and request that times a safety coefficient (see "Requesting the time").
  nprocs must split the grid
  into a 2D pencil grid; configure refuses one that cannot.
  Before production, in order. Installs: when the run needs more than one
  package (this solver and a pvserver to watch it, say), submit each install
  through the normal install path as soon as it is known, all together; they
  do not depend on each other, so do not wait for one to finish before
  starting the next. Install what the candidates offer, and use a site's own
  build only when it is offered as a candidate and the person picks it.
  Smoke: one smoke run per build, of the case to be run, not one per case;
  the parameter checks before submit already cover dt, the case's parameters
  and the decomposition, so a second smoke of another case tells nothing new.
  When the production grid fits one solver node, that smoke is the pilot:
  run it at the production grid and inputs on one node with ilast two
  snapshots, and size production from its seconds per step; the solver and
  its inputs are the same, so production gives the same results without a
  separate pilot job and its queue wait. With no earlier run to estimate
  from, set its ioutput to a few hundred steps so a snapshot still lands
  early. Run a separate pilot only when the grid needs more than one node.
  Fitting the person's budget: size production to the time and nodes the
  person gave (say, results within an hour on up to 8 nodes), not to the
  finest grid the cluster could hold. Measure first. A pilot is a short run
  of the production grid, or close to it, on the fewest nodes that hold it:
  one solver node whenever the grid fits there (a periodic section of a few
  million points does; pick an nprocs up to ppn that has a pencil split), more only when
  one node's memory cannot hold it. Within a node the transposes stay in
  shared memory, so one node gives the cleanest seconds per step and the
  first snapshot soonest; across nodes the transposes cross the network and
  a thin periodic span (nz near 8) can run slower per step on two nodes than
  on one. It exists to measure seconds per step and the cost of one snapshot
  write, so it must write a snapshot early: estimate its seconds per step
  from the smoke run's throughput (point-steps per second per rank), when
  the smoke was not itself the pilot, before submitting, set its ioutput so the first snapshot lands within the first
  quarter of its walltime, and its ilast to two snapshots. A pilot that hits
  its walltime before a snapshot measured nothing about the writes and is
  wasted. Read the seconds per step from the solver's per-step timing lines,
  or from the gap between two snapshots divided by ioutput. Also read the
  pilot's startup overhead: the time from the job starting on its nodes to
  the solver's first step, which is activating the package environment plus
  any service started beside the solver becoming ready (a pvserver to watch
  it, say). Take it from the pilot's run record: metadata.phase_timings
  before_first_step_seconds plus the ready_seconds of each service package
  in phase_timings.packages. Only when the record has no phase timings, take
  it as the gap between the job's start time and the first per-step timing
  line; never guess it. It does not shrink with the
  grid or the step count, and on a short run it can be a large share of the
  wall time. Then project each candidate: wall seconds = startup overhead +
  seconds per step x ilast + snapshot write seconds x ilast / ioutput.
  Seconds per step belongs to one grid and one decomposition (nx, ny, nz,
  nprocs, p_row x p_col, nodes): use the measured figure only for a
  candidate with the pilot's grid and decomposition, and never rescale it
  to another grid or rank count. Per-step cost does not follow the point
  count: fixed per-step work, the transposes and small pencils dominate a
  coarse grid, so a grid with 8 times fewer points can run nearly as slowly
  per step. A candidate on another grid or decomposition is only a rough
  screen until measured: mark its projection as unmeasured, and before it
  becomes the production request, re-pilot at that grid and decomposition
  (a short run, ilast two snapshots, first snapshot early) or re-measure it
  from an earlier run of exactly that setup. If production's grid or
  decomposition changes after the pilot, measure again before sizing. Do
  not assume more nodes speed it up: a candidate on more nodes than the
  pilot is unmeasured too, so recommend one solver node when it fits the
  budget, and measure a second node count only when the budget needs it.
  Offer two or three candidates,
  each with its grid, nodes and projected wall time, mark exactly one as recommended,
  the one whose projected wall time fits the person's time and node budget,
  and say what each gives up. If none fits, say so and recommend the
  closest; do not recommend one that overruns the budget. Coarsening pays
  most: cost goes with resolution^3 for a periodic span (nx x ny points and a
  dt that shrinks with h) and resolution^4 for span free, and span free on a
  finite wing costs tens of times a periodic section, so within an hour
  prefer a periodic section unless the tips are the point, and shorten the
  simulated time before giving up the wake entirely.
  Requesting the time: ask the scheduler for the projected wall time times a
  generous safety coefficient, 1.5 at least and 2 when the projection rests
  on one short pilot or none, rounded up. Overallocate rather than cut it
  close: a job killed at its limit loses every step after its last snapshot,
  and schedulers such as Slurm charge the time a job used, not the time it
  asked for, so a job that ends cleanly before its limit costs nothing for
  the rest (a longer request can wait a little longer in the queue). Say so
  in the spend approval: the projected time, the coefficient, the padded
  request, and that unused time is not charged when the run ends cleanly.
  If the padded request exceeds the partition's maximum wall time (the time
  limit in the site's partitions), say so and propose options for the person
  to pick: another partition with a longer limit, a shorter run (fewer steps,
  or a coarser grid measured by its own pilot), or more nodes when a measured
  run shows they shorten it. Do not trim the coefficient to squeeze under the limit.
  Outputs: snapshots of ux, uy, uz, pp, vort, critq and (body case) ep, the
  body indicator, go to a growing BP5 output that ParaView's ADIOS2VTXReader
  follows while the run goes; a slice at mid-span coloured by vort shows the
  wake, and a contour of ep at 0.5 shows the body. clio-case.json in the run
  directory gives the grid, the body placement and the stability numbers,
  body.stl is the body in solver coordinates, and forces.dat holds drag and
  lift by time. With icheckpoint set, the run also writes restart files
  (checkpoint.bp5 and restart.info) and, with initstat set too, averaged
  statistics (statistics.bp5) every icheckpoint steps; both are off by
  default. All of these go to run_dir; set run_dir to a folder you can
  read (beside the geometry, say) and open <run_dir>/data.bp5 in ParaView as
  soon as the job runs to watch it grow. While the run goes, each node that
  runs solver ranks syncs data.bp5 to the file server every second, so a
  viewer on another machine sees each snapshot as it lands rather than in
  30 s bursts, whichever nodes the solver runs on. If no live view
  could follow the run, offer when it ends to open the finished data.bp5 in
  ParaView (a slice at mid-span coloured by vort, at the last step) and open
  it once the person agrees.
  Failed runs: Incompact3d ends a diverged run with exit code 0, and a NaN
  velocity passes its own check, so the package watches the per-step lines.
  It stops the run at the first NaN or infinite velocity or divergence, or a
  velocity past 100 x inflow, and a run that ends with no snapshot fails too,
  as does a solver that exits before its first step (launch_failed, with the
  launcher's own lines, such as a rank placement the allocation cannot hold).
  Every run writes clio-run-result.json to run_dir (status ok, diverged,
  no_output or failed, the cause, the step and time reached, dt, the velocity
  extremes, snapshots written of expected, seconds per step, the stability
  numbers and the last solver lines), and a failed run raises with that
  evidence. Network fallback warnings (UCX or libfabric skipping a device it
  cannot use, Open MPI skipping an OpenFabrics port) are kept out of the last
  lines and reported under transport as information: the device skipped, the
  transport offered instead and the launch's transport settings. They are
  never the cause of a verdict and do not call for a site network change. A
  diverged run needs a smaller dt (case.suggested_dt is the
  bound; halve dt if it diverged within it) or a body thick enough on the
  grid; a no_output run needs ioutput at most ilast. Change the case before
  resubmitting; the same inputs diverge the same way.
install:
  method: spack
  # MPI stays the mpi virtual, so the site's MPI (Ares: its openmpi) is reused.
  query: xcompact3d@5.0 +clio ^decomp2d-fft io=adios2 ^adios2+mpi+fortran
  repos: [spack]
parameters:
  required: [nprocs, ilast, ioutput, dt]
  # n sizes only the Taylor-Green grid; the body case takes its grid from resolution.
  cases:
    - name: taylor-green
      when: {geometry: {const: ""}}
      properties:
        n: {enum: [33, 65, 129, 257]}
  properties:
    nprocs: {minimum: 1, maximum: 65536}
    ppn: {minimum: 1, maximum: 256}
    cores_per_node: {minimum: 1, maximum: 1024}
    icheckpoint: {minimum: 0}
    initstat: {minimum: 0}
    inflow: {exclusiveMinimum: 0}
    angle: {minimum: -90, maximum: 90}
    resolution: {minimum: 4, maximum: 512}
    reference_length: {minimum: 0}
    upstream: {minimum: 0.5}
    downstream: {minimum: 1}
    lateral: {minimum: 0.5}
    ilast: {minimum: 1}
    ioutput: {minimum: 1}
    dt: {exclusiveMinimum: 0}
    re: {exclusiveMinimum: 0}
    walltime: {minimum: 1}
  review: [geometry, run_dir, nprocs, ppn, resolution, span, angle, inflow, re, ilast, ioutput, dt, n, icheckpoint, initstat, walltime, queue]
  fill:
    input_template: "{pkg_dir}/config/input_DNS_Re1600.i3d"
    run_dir: "{shared_dir}/run"

resources:
  process_count: {param: nprocs}
  processes_per_node: {param: ppn}
  duration: {param: walltime}
  queue_name: {param: queue}

sizing:
  mesh: >-
    nx x ny x nz grid points. Body case: about (upstream + body length +
    downstream) x resolution by (body height + 2 x lateral) x resolution, by
    max(8, span x resolution / 2) for a periodic span or (body depth + 2 x
    lateral) x resolution for span free, each rounded up to an FFT-friendly
    count; clio-case.json records the grid chosen. Taylor-Green case: n x n x n.
  decomposition: pencil2d
  ranks: >-
    nprocs = p_row x p_col, a 2D pencil grid that 2DECOMP&FFT needs with p_row
    at most min(nx, ny) and p_col at most min(ny, nz); configure picks the
    split closest to square and refuses an nprocs that has none. A periodic
    span has nz = 8 or a little more, so it allows at most min(nx, ny) x nz
    ranks. Choose nprocs from the mesh: more ranks shorten the run until each
    pencil is so small that the transposes dominate, so keep each rank's
    share, nx x ny x nz / nprocs, in the tens of thousands of points or more,
    and prefer an nprocs with a near-square split (a power of two, or a
    multiple of ppn).
  processes_per_node: {param: ppn, default: physical_cores, cores: cores_per_node}
  nodes: {ceil_div: [nprocs, ppn]}
  cost: >-
    walltime seconds = nx x ny x nz x ilast / (throughput x nprocs), with the
    throughput in point-steps per second per rank measured on the site with a
    short run of the same build and rank count range; add a margin for
    snapshot writes, which grow with nx x ny x nz x 7 doubles per snapshot.
    A pilot (the smoke itself when the grid fits one node) runs on the fewest nodes that hold the grid, one solver node
    when it fits, and writes a snapshot early (first snapshot in the first
    quarter of its walltime), so its seconds per step and write time are
    both measured soon. Project each candidate's wall time as the pilot's
    measured startup overhead (environment activation and any service beside
    the solver becoming ready: the run record's phase_timings
    before_first_step_seconds plus each service's ready_seconds, else job
    start to first step) plus seconds per step x ilast
    plus the snapshot writes, with seconds per step measured at that
    candidate's own grid and decomposition: never rescaled from another grid
    or rank count, and on more nodes not assumed faster than measured. The
    throughput formula above only screens candidates; re-pilot or re-measure
    a candidate before its wall time becomes a request. Request that total times a generous safety
    coefficient (1.5 at least, 2 when it rests on one short pilot or none) as
    the job's walltime, since unused time is not charged when the run ends
    cleanly, and say so in the spend approval. If the padded request exceeds
    the partition's maximum wall time, say so and let the person pick another
    partition, a shorter run or more nodes. Recommend the candidate whose
    projected wall time fits the person's stated time and node budget (see
    the summary).

outputs:
  - name: snapshots
    path: "{run_dir}/data.bp5"
    path_kind: directory
    format: adios2-bp5
    reader: ADIOS2VTXReader
    expected_steps: {div: [ilast, ioutput]}
    follow: {signal: reader-time-steps, poll_seconds: 2}
    time: {unit: simulation time, step_interval: {mul: [dt, ioutput]}}
    display:
      array: vort
      association: POINTS
      representation: Slice
      slice_normal: [0, 0, 1]
      color_map: Viridis (matplotlib)
    # Both cases; the body case adds ep.
    arrays: [ux, uy, uz, pp, vort, critq]
  - name: statistics
    role: statistics
    description: >-
      Time-averaged statistics (means and second moments of the velocity and
      pressure) from step initstat, written every icheckpoint steps; only when
      both icheckpoint and initstat are set.
    path: "{run_dir}/statistics.bp5"
    path_kind: directory
    format: adios2-bp5
  - name: restart
    role: restart
    description: >-
      Restart file with the whole flow state, written every icheckpoint steps
      with restart.info beside it (the step and time it holds); only when
      icheckpoint is set.
    path: "{run_dir}/checkpoint.bp5"
    path_kind: directory
    format: adios2-bp5

progress:
  unit: step
  # "Writing snapshots =>           2" is printed before snapshot 2 is written.
  step_pattern: '^Writing snapshots =>\s*(?P<step>\d+)\s*$'
  announces: before-write
  output: snapshots
  total: {div: [ilast, ioutput]}

provenance:
  inputs:
    - "{run_dir}/input.i3d"
    - "{run_dir}/adios2_config.xml"
    - "{run_dir}/clio-vtk.xml"
    - "{run_dir}/clio-case.json"
  upstream:
    - name: >-
        Incompact3d v5.0 with 2DECOMP&FFT 2.0.4, built by the Spack recipes
        clio.xcompact3d +clio and clio.decomp2d-fft io=adios2 in spack/, whose
        patch() methods add the clio VTX output, the body mask and BP5 naming
      version: "5.0"
      url: https://github.com/xcompact3d/Incompact3d/tree/v5.0
    - name: Incompact3d examples/TGV-Taylor-Green-vortex/input_DNS_Re1600.i3d (BSD-3-Clause, see NOTICE)
      version: "5.0"
      url: https://github.com/xcompact3d/Incompact3d/tree/v5.0/examples/TGV-Taylor-Green-vortex

selftest:
  # A cylinder of diameter 1 in a periodic span at Re 300: 181 x 90 x 8 points.
  params:
    nprocs: 4
    ppn: 4
    geometry: "{pkg_dir}/config/cylinder.stl"
    resolution: 12
    re: 300
    dt: 0.005
    ilast: 200
    ioutput: 20
    walltime: 900
  max_seconds: 900
  script: selftest.py
