schema: clio.package-contract.v1
package: wrf
version: 0.1.1
kind: application
summary: >-
  WRF ARW 4.6 on a real-data case (em_real, dmpar). case_dir holds what
  real.exe produced, wrfinput_d01 and wrfbdy_d01, with the namelist.input it
  was made with and any physics tables (*.dat) the case brings. The package
  links WRF's own run tables from the install, writes namelist.input with the
  run length, history interval and process grid, runs wrf.exe under MPI and
  follows rank 0's rsl.out.0000, so progress counts each history file
  (wrfout_d01_<time>, netCDF) as it is written. A site that already built WRF
  in Spack is reused as it is, with nothing to build. A credible public case
  is NCAR's WRF v4.4 CONUS 12 km benchmark
  (https://www2.mmm.ucar.edu/wrf/users/benchmark/v44/v4.4_bench_conus12km.tar.gz,
  3.2 GB): 425 x 300 x 35 points, 72 s step, 12 h of boundary data from
  2019-11-26_12:00:00. Only wrfinput_d01, wrfbdy_d01, namelist.input and the
  *.dat tables are needed. With case_url set to such an archive and case_dir
  absent or empty, the job fetches the archive on the site once, streaming it
  through tar so only the case's files land in case_dir, with its SHA-256 and
  source in clio-input-source.json; later runs reuse the case. This works on
  a guarded site, where the package is the reviewed code that downloads, and
  nothing passes through the person's computer. The reference output
  wrfout_d01_2019-11-27_00:00:00.gnu with diffwrf.py checks a full 12 h run.
  Keep case data outside the relay home, which a site clean deletes.
install:
  method: spack
  # MPI stays the mpi virtual, so the site's MPI and any site WRF are reused.
  query: wrf@4.6.1 build_type=dmpar compile_type=em_real
  repos: []

parameters:
  required: [nprocs, case_dir, run_minutes, history_interval]
  properties:
    nprocs: {minimum: 1, maximum: 65536}
    ppn: {minimum: 1, maximum: 256}
    cores_per_node: {minimum: 1, maximum: 1024}
    case_dir: {minLength: 2}
    case_url: {pattern: "^(https://\\S+)?$"}
    case_sha256: {pattern: "^([0-9a-fA-F]{64})?$"}
    run_minutes: {minimum: 1}
    history_interval: {minimum: 1}
    time_step: {minimum: 1}
    nproc_x: {minimum: -1}
    nproc_y: {minimum: -1}
    walltime: {minimum: 1}
  review: [nprocs, ppn, case_dir, case_url, case_sha256, run_minutes, history_interval, time_step, walltime, queue]
  fill:
    run_dir: "{shared_dir}/run"

resources:
  process_count: {param: nprocs}
  processes_per_node: {param: ppn}
  duration: {param: walltime}
  queue_name: {param: queue}

sizing:
  mesh: >-
    e_we x e_sn x e_vert points of domain 1, read from the case's
    namelist.input (&domains); the run does run_minutes x 60 / time_step
    steps. The time step stays the case's unless the person sets one; WRF's
    rule of thumb is at most 6 x dx in km seconds, and the case's own value
    already meets it.
  decomposition: pencil2d
  ranks: >-
    WRF splits the horizontal grid into nproc_x x nproc_y patches, each with
    full columns, nearest square unless both are set. A patch needs at least
    10 cells a side, or WRF stops at start, so nprocs is at most about
    (e_we / 10) x (e_sn / 10) under a near-square split; the package rejects a
    count above that before the job starts and names the largest it allows.
    Patches of 25 to 40 cells a side keep the halo exchange small beside the
    physics; for the 425 x 300 CONUS 12 km case that is about 80 to 200
    processes.
  processes_per_node: {param: ppn, default: physical_cores, cores: cores_per_node}
  nodes: {ceil_div: [nprocs, ppn]}
  cost: >-
    walltime seconds = steps x seconds per step, with the seconds per step
    measured on the site (a previous run's clio-run-result.json
    seconds_per_step at the same process count, else a short run), plus the
    first step (it reads the boundary data and is several times slower,
    first_step_seconds), one history write per history_interval and the
    startup the run record measured. Request that times a safety coefficient
    of 1.5 at least, 2 when it rests on one short run or none: unused time is
    not charged when the run ends cleanly, so say so in the spend approval.
    The first run that fetches its case through case_url also downloads the
    archive inside the job (3.2 GB for CONUS 12 km, a few minutes at site
    bandwidth); add that time once.
    NCAR measured about 0.4 s per step for the CONUS 12 km case on 144 cores.

outputs:
  - name: history
    description: >-
      One netCDF history file per history_interval, from the start time
      (step 0) to the end, named wrfout_d01_<YYYY-MM-DD_hh:mm:ss>. T2, U10,
      V10, PSFC, RAINNC and the 3D state are in each.
    path: "{run_dir}/wrfout_d01_*"
    path_kind: glob
    format: netcdf
    reader: NetCDFCFReader
    expected_steps: {div: [run_minutes, history_interval]}
    follow: {signal: file-count, poll_seconds: 10}
    time: {unit: simulated minutes, step_interval: {param: history_interval}}
    display:
      array: T2
      association: POINTS
      representation: Surface
      color_map: Turbo
    arrays: [T2, U10, V10, PSFC, RAINNC, T, U, V, W, QVAPOR]
  - name: run-result
    role: result
    description: >-
      clio-run-result.json, the run's verdict (schema clio.wrf-run.v1): status,
      cause, the model time reached, history files written of expected, steps,
      seconds per step and the first step's seconds, wall seconds and, on
      failure, the tail of rsl.error.0000. Every run writes it.
    path: "{run_dir}/clio-run-result.json"
    path_kind: file
    format: json
  - name: log
    role: statistics
    description: rank 0's log, with the timing of every step and history write.
    path: "{run_dir}/rsl.out.0000"
    path_kind: file
    format: text

progress:
  unit: step
  # The package prints "clio-wrf history N of M <file>" after history file N is written.
  step_pattern: '^clio-wrf history (?P<step>\d+) of \d+'
  announces: after-write
  output: history
  total: {div: [run_minutes, history_interval]}
  done_pattern: SUCCESS COMPLETE WRF

provenance:
  inputs:
    - "{run_dir}/namelist.input"
    - "{run_dir}/clio-case.json"
    - "{case_dir}/wrfinput_d01"
    - "{case_dir}/wrfbdy_d01"
  upstream:
    - name: WRF ARW 4.6.1 (em_real, dmpar), as Spack's builtin wrf recipe builds it
      version: "4.6.1"
      url: https://github.com/wrf-model/WRF/releases/tag/v4.6.1
    - name: NCAR WRF v4.4 benchmark, CONUS 12 km (the case the sizing and summary name)
      version: "4.4"
      url: https://www2.mmm.ucar.edu/wrf/users/benchmark/v44/benchdata_v44.html

selftest:
  # One hour of the CONUS 12 km benchmark on one node; case_dir must hold it.
  params:
    nprocs: 40
    ppn: 40
    case_dir: "~/wrf-cases/v4.4_bench_conus12km"
    run_minutes: 60
    history_interval: 30
    walltime: 1800
  max_seconds: 1800
  script: selftest.py
