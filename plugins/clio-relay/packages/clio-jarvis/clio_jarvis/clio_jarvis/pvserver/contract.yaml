schema: clio.package-contract.v1
package: pvserver
title: ParaView server
version: 0.3.12
kind: service
summary: >-
  ParaView 5.13.1 pvserver bound to 127.0.0.1 with offscreen OSMesa rendering,
  built by Spack with MPI and ADIOS2. A ParaView client reaches it through an
  SSH tunnel to the reported port and opens clio outputs with the reader their
  view descriptor names. Its install does not depend on the application it
  will view: when a run needs both, submit this install through the normal
  install path at the same time as the application's, not after it. Install
  what the candidates offer; a site's own ParaView is used only when it is
  offered as a candidate and the person picks it. A server whose ranks never
  listen fails typed rather than holding its allocation: a known launcher
  failure (MPI wire-up, unreachable network, MPI_Init, a missing library)
  stops it a minute after it shows, anything else at start_timeout, and
  pvserver-stop.json carries the cause code, the hosts, the launch's network
  selection and the last output lines, which the start error repeats.
  Network fallback warnings (UCX or libfabric skipping a device such as
  mlx5_0:1 and going on over another transport) stay out of those lines;
  the stop record reports them under transport as information, never as
  the cause, and they do not call for a site network change.
  In a pipeline with a solver, pvserver outlives it: once the pipeline's
  steps finish it keeps serving for linger seconds (default 180, 0 for
  none) so a client can still attach and look at the final output, then
  stops with reason linger-ended. The linger ends before the job's wall
  time (the scheduler's time left, else walltime), and at once on jarvis
  ppl stop, a cancel or a signal; after a failed step there is none.
  pvserver-ready.json says lingering with linger_until, and the stop record
  carries a linger block. Request the job's walltime as the solver's
  walltime plus twice the linger (6 minutes more at the default), since a
  job ends, and is charged, when its pipeline does.
  A pvserver that crashes (a segfault in a filter, a nonzero exit) starts
  again on the same port up to crash_restarts times (default 3), so a
  client can rejoin and rebuild its scene; the ready record counts crashes
  with the last one's output, and the stop record lists every crash.

install:
  method: spack
  # Spack's builtin paraview recipe; MPI stays the mpi virtual, so the site's
  # MPI and Mesa are reused. 5.13.1 matches the CLIO ParaView MCP client.
  query: paraview@5.13.1 +mpi +adios2 +python ~qt ^[virtuals=gl] osmesa
  repos: []

parameters:
  required: [nprocs, port]
  properties:
    nprocs: {minimum: 1, maximum: 1024}
    ppn: {minimum: 1, maximum: 256}
    cores_per_node: {minimum: 1, maximum: 1024}
    port: {minimum: 0, maximum: 65535}
    connect_id: {minimum: 0, maximum: 2147483647}
    # No default and no cap: absent means the server runs until it is stopped.
    max_lifetime: {minimum: 1}
    # No cap either; 0 means the server stops with the pipeline's steps.
    linger: {minimum: 0}
    # 0 means a crash ends the service.
    crash_restarts: {minimum: 0}
    start_timeout: {minimum: 5, maximum: 3600}
    walltime: {minimum: 1}
  review: [nprocs, port, connect_id, max_lifetime, linger, walltime, queue]
  fill:
    state_dir: "{shared_dir}/pvserver"

resources:
  process_count: {param: nprocs}
  processes_per_node: {param: ppn}
  duration: {param: walltime}
  queue_name: {param: queue}

sizing:
  mesh: The datasets clients open; pvserver holds no mesh of its own.
  decomposition: data-parallel
  ranks: >-
    nprocs pvserver ranks; readers split a dataset across them. One rank renders
    a small case; add ranks when a dataset no longer fits one node's memory or
    renders too slowly. The ranks run on the package's hosts (its hostfile,
    narrowed by host_slice) with rank 0, the one clients reach, on the node
    that runs JARVIS; without a hostfile they share that node.
  processes_per_node: {param: ppn, default: physical_cores, cores: cores_per_node}
  nodes: {ceil_div: [nprocs, ppn]}

outputs: []

progress:
  unit: service
  ready_pattern: '^clio-pvserver ready port=(?P<port>\d+)\b'

service:
  ports:
    - name: paraview
      protocol: tcp
      port: {param: port}
      bind: 127.0.0.1
      health:
        kind: tcp-listen
        note: >-
          Checked in /proc/net/tcp, never by connecting: pvserver serves the
          first client that connects. Port 0 means the ready event carries the
          chosen port.
      protection:
        bind: loopback
        connect_id: {param: connect_id}
        note: Reached only through an SSH tunnel; a nonzero connect_id must also match.
  stop:
    signal: SIGTERM
    writes: "{state_dir}/pvserver-stop.json"
    record: clio.service-stop.v1
    # Within jarvis-cd's 20 s stop grace, after which the job's tree gets KILL.
    grace_seconds: 15
  runtime:
    record: jarvis.service-runtime.v2
    lifecycle: [starting, ready, degraded, stopping, stopped, failed]
    endpoint:
      host: rank0-node
      port: {param: port}
      note: >-
        host is the node running rank 0 (the one running JARVIS) and port the
        port pvserver listens on. pvserver binds 127.0.0.1 there, so a client
        reaches cs://host:port through an SSH tunnel to host. The runtime's
        protocol is tcp (base_url tcp://host:port), which needs jarvis-cd
        4007fd14 or newer; the ready message names cs://.
  # The solver's outputs flow into pvserver, though JARVIS starts pvserver first.
  data_flow:
    direction: in
    kind: stream
    label: outputs it views
  max_lifetime: {param: max_lifetime}
  linger: {param: linger}

provenance:
  inputs: []
  upstream:
    - name: ParaView pvserver (Spack builtin paraview, offscreen OSMesa)
      version: "5.13.1"
      url: https://www.paraview.org/download/

selftest:
  # The generic runner's 'jarvis ppl run' starts and then stops the server.
  # selftest.py also serves it as relay does, with no lifetime: through
  # 'ppl start', a held wait and 'ppl stop', and through 'ppl run' with hold.
  # Then coupled to a step (a trivial one the check writes) it lingers: once to the end of a
  # 40 s linger with a client attaching, once stopped by SIGTERM mid-linger.
  params: {nprocs: 1, ppn: 1, port: 0, start_timeout: 120}
  max_seconds: 600
  script: selftest.py
