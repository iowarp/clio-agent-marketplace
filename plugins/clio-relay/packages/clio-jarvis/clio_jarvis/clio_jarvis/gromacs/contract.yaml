schema: clio.package-contract.v1
package: gromacs
title: GROMACS
version: 0.1.0
kind: application
summary: >-
  GROMACS 2024.3, the biomolecular molecular dynamics code (proteins,
  membranes, nucleic acids and small molecules in water), with MPI. The case
  is GROMACS's own files (https://manual.gromacs.org/2024.3/user-guide/mdp-options.html):
  mdp, the run parameters of the watched run (integrator, dt, cutoffs and
  PME, thermostat and barostat, constraints), and files, everything else it
  reads: the structure (.pdb or .gro), the topology (.top and its .itp), the
  .mdp files of earlier stages and an index. Author them for the person's
  case; nothing here fixes a scenario. Force fields and water models come
  from the GROMACS install (#include "oplsaa.ff/forcefield.itp", amber99sb-ildn.ff,
  charmm27.ff and others; pdb2gmx -ff and -water choose them without a
  prompt). prepare runs the stages before the watched run, one gmx command
  per line in run_dir (pdb2gmx, editconf, solvate, grompp, genion, and
  mdrun for minimisation and equilibration); a line ending in <<< and words
  answers the tool's prompts, one word per prompt (genion ... <<< SOL).
  mdrun stages run on all the ranks, the other tools on one. The watched
  run is grompp of md.mdp (the mdp with nsteps and the trajectory intervals
  set by the package) with structure and topology, then mdrun -deffnm md.
  Every frame_interval steps mdrun appends a full-precision frame to md.trr;
  the package turns each whole one into run_dir/frames/frame_<step>.vtp, a
  VTK PolyData file of the atoms (positions in nm, element, residue, solvent,
  velocity and speed), so ParaView's XML PolyData reader follows the series
  live; progress counts them. The software is any Spack gromacs 2024.3 with
  MPI (gmx_mpi, single precision); a site that already has one is reused as
  it is. MPI, the launcher, the nodes and the ranks per node come from the
  site through JARVIS, never from the files.
install:
  method: spack
  # MPI stays the mpi virtual, so the site's MPI is reused; Spack's builtin
  # gromacs recipe builds gmx_mpi with FFTW and OpenMP.
  query: gromacs@2024.3 +mpi
  repos: []

parameters:
  required: [nprocs, mdp, structure, topology, nsteps, frame_interval]
  properties:
    nprocs: {minimum: 1, maximum: 65536}
    ppn: {minimum: 1, maximum: 256}
    cores_per_node: {minimum: 1, maximum: 1024}
    ntomp: {minimum: 1, maximum: 256}
    mdp: {minLength: 1}
    structure: {minLength: 1}
    topology: {minLength: 1}
    maxwarn: {minimum: 0, maximum: 20}
    nsteps: {minimum: 1}
    frame_interval: {minimum: 1}
    walltime: {minimum: 1}
  review: [mdp, files, prepare, structure, topology, nprocs, ppn, ntomp, nsteps, frame_interval, maxwarn, walltime, queue]
  fill:
    run_dir: "{shared_dir}/run"

resources:
  process_count: {param: nprocs}
  processes_per_node: {param: ppn}
  duration: {param: walltime}
  queue_name: {param: queue}

sizing:
  mesh: >-
    No mesh: the cost is the atoms, mostly water. A protein solvated with
    editconf -d 1.0 -bt dodecahedron and solvate holds about 100 atoms per
    nm^3 of box (water is 33 molecules per nm^3, 3 atoms each); lysozyme
    (1AKI) so becomes about 33,000 atoms. PME's grid follows the box:
    fourierspacing 0.12 nm by default.
  decomposition: block3d
  ranks: >-
    mdrun splits the box into domains, one per particle-particle rank, each
    at least the cutoff plus a margin across (about 1.2 nm with rc = 1.0),
    so a box of side L nm takes at most about (L / 1.2)^3 domains; above 18
    ranks mdrun also gives about a quarter of them to PME. Keep about 500
    atoms or more per core (ranks x ntomp): lysozyme in water scales to
    about 64 cores. Prefer an nprocs that fills whole nodes; mdrun stops
    with an error naming the decomposition when the box is too small for
    the ranks.
  processes_per_node: {param: ppn, default: physical_cores, cores: cores_per_node}
  nodes: {ceil_div: [nprocs, ppn]}
  cost: >-
    walltime seconds = the prepare stages plus nsteps x dt / (ns per day /
    86400) for the watched run, with ns per day measured on the site at the
    same atoms and cores: a previous run's clio-run-result.json ns_per_day,
    else a short mdrun of a few thousand steps. As a screen, a single
    precision CPU run does about 1e-6 core-seconds per atom-step, so 33,000
    atoms on 32 cores at dt 2 fs is about 100 ns per day. Each frame holds
    12 bytes per atom in md.trr (24 with velocities) and about 40 in its
    .vtp. Request that total times 1.5 at least, 2 when it rests on one short
    run or none: unused time is not charged when the run ends cleanly, so
    say so in the spend approval. With a pvserver watching the run in the
    same job, add twice pvserver's linger.

outputs:
  - name: frames
    description: >-
      One frame per frame_interval steps of the watched run from step 0,
      named frames/frame_<step, ten digits>.vtp: VTK XML PolyData with one
      point per atom (positions in nm) and point arrays atom, element
      (atomic number from the atom name), residue, solvent (1 for water),
      velocity and speed, the simulated time in ps as TimeValue and the box
      as field data. ParaView's XMLPolyDataReader reads the series.
    path: "{run_dir}/frames/frame_*.vtp"
    path_kind: glob
    format: vtk-polydata
    reader: XMLPolyDataReader
    expected_steps: {add: [{div: [nsteps, frame_interval]}, 1]}
    follow: {signal: file-count, poll_seconds: 5}
    time: {unit: ps}
    display:
      array: element
      association: POINTS
      representation: Surface
      color_map: Jet
    arrays: [atom, element, residue, solvent]
  - name: run-result
    role: result
    description: >-
      clio-run-result.json, the run's verdict (schema clio.gromacs-run.v1):
      status, cause (a failed prepare stage, grompp or mdrun), frames
      written of expected, the last step and time, the atoms, mdrun's ns per
      day, wall seconds and the ranks and threads. Every run writes it.
    path: "{run_dir}/clio-run-result.json"
    path_kind: file
    format: json
  - name: log
    role: statistics
    description: >-
      md.log, mdrun's own log of the watched run: the energies every nstlog
      steps, the decomposition, the timing breakdown and the performance.
    path: "{run_dir}/md.log"
    path_kind: file
    format: text
  - name: energies
    role: statistics
    description: >-
      md.edr, the energy file of the watched run (gmx energy reads it:
      temperature, pressure, density, potential and kinetic energy).
    path: "{run_dir}/md.edr"
    path_kind: file
    format: gromacs-edr
  - name: final-structure
    role: restart
    description: >-
      md.gro, the last coordinates of the watched run, and md.cpt beside it
      for a continuation.
    path: "{run_dir}/md.gro"
    path_kind: file
    format: gromacs-gro

progress:
  unit: step
  # The package prints "clio-gromacs frame I of M" once frame I is whole in frames/.
  step_pattern: '^clio-gromacs frame (?P<step>\d+) of \d+'
  announces: after-write
  output: frames
  total: {div: [nsteps, frame_interval]}
  done_pattern: '^clio-gromacs result \{"status": "ok"'

provenance:
  inputs:
    - "{mdp}"
    - "{run_dir}/clio-case.json"
  upstream:
    - name: GROMACS 2024.3 (MPI, single precision), as Spack's builtin gromacs recipe builds it
      version: "2024.3"
      url: https://gitlab.com/gromacs/gromacs/-/tree/v2024.3

selftest:
  # 3 nm of SPC/E water: solvate, minimise, then 10 ps of NVT at 300 K.
  params:
    nprocs: 8
    ppn: 8
    mdp: "{pkg_dir}/config/water_nvt.mdp"
    files: "{pkg_dir}/config/topol.top {pkg_dir}/config/em.mdp"
    prepare: |
      solvate -cs spc216.gro -box 3 3 3 -o solvated.gro -p topol.top
      grompp -f em.mdp -c solvated.gro -p topol.top -o em.tpr
      mdrun -deffnm em
    structure: em.gro
    topology: topol.top
    nsteps: 5000
    frame_interval: 100
    walltime: 900
  max_seconds: 900
  script: selftest.py
