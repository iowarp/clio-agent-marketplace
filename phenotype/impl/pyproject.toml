[project]
name = "phenotype-workload"
version = "0.1.0"
description = "Synthetic phenotyping workload: deterministic 5-stage pipeline + SQLite provenance capture (the swappable demo science SPOTTER watches)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
phenotype-mcp = "phenotype_workload.workload:main"
spotter-campaign = "phenotype_workload.pipeline.campaign:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phenotype_workload"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
